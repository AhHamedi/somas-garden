name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.23"
      - run: npm ci
      - run: npm test
      - if: runner.os == 'Linux'
        run: npm run test:go -- --race
      - if: runner.os == 'Linux'
        run: npx prettier --check .
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.23"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
